draw_config:
  n_columns: 2
  dark_mode: true
  glyph_tap_size: 20
  glyph_urls:
    twemoji: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/{}.svg"

parse_config:
  zmk_additional_includes:
    - /west/zmk-helpers/include
    - /west/zmk-auto-layer/dts
    - /west/zmk-adaptive-key/include
    - /west/zmk-unicode/include

  raw_binding_map:
    # Mouse movement
    '&mmv MOVE_LEFT':  {t: "←", h: Move}
    '&mmv MOVE_RIGHT': {t: "→", h: Move}
    '&mmv MOVE_UP':    {t: "↑", h: Move}
    '&mmv MOVE_DOWN':  {t: "↓", h: Move}
    # Scroll
    '&msc SCRL_LEFT':  {t: "←", h: Scroll}
    '&msc SCRL_RIGHT': {t: "→", h: Scroll}
    '&msc SCRL_UP':    {t: "↑", h: Scroll}
    '&msc SCRL_DOWN':  {t: "↓", h: Scroll}
    # Mouse buttons
    '&mkp MB1': LClick
    '&mkp MB2': RClick
    '&mkp MB3': MClick
    # System
    '&sys_reset':  Reset
    '&bootloader': Boot
    # Custom behaviors / macros
    '&dot_spc': ". ⇧"
    '&num_word 1': Num Word
    '&magic_shift LSHFT 0': "Magic Shift"
    '&ht LC(LS(V)) V': {t: V, h: Paste}
    # Unicode - Symbols
    '&uc 0xe4 0xc4': "Ä"
    '&uc 0xdf 0x1e9e': "ß"
    '&uc 0x20ac 0': "€"
    '&uc 0xfc 0xdc': "Ü"
    '&uc 0xf6 0xd6': "Ö"
    '&uc 0xB0 0': "°"
    '&uc 0x2190 0x21D0': {t: "←", s: "⇐"}
    '&uc 0x2193 0x21D3': {t: "↓", s: "⇓"}
    '&uc 0x2191 0x21D1': {t: "↑", s: "⇑"}
    '&uc 0x2192 0x21D2': {t: "→", s: "⇒"}
    # Unicode - emoji (Twemoji SVG glyphs for color rendering)
    '&uc 0x2753 0':  {t: "$$twemoji:2753$$"}
    '&uc 0x1F44B 0': {t: "$$twemoji:1f44b$$"}
    '&uc 0x1F440 0': {t: "$$twemoji:1f440$$"}
